<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#030509">
    <title>Ftermx — Login</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap');

        :root {
            --bg-void: #030509;
            --neon-cyan: #00d4ff;
            --neon-green: #00ff88;
            --neon-purple: #a855f7;
            --neon-red: #ff3d5a;
            --text-bright: #e2eaf5;
            --text-mid: #7a8fa6;
            --text-dim: #3d5068;
            --border-glow: rgba(0, 212, 255, 0.18);
            
            /* Responsive font sizes */
            --fs-small: clamp(10px, 1.5vw, 12px);
            --fs-medium: clamp(13px, 2vw, 15px);
            --fs-large: clamp(18px, 3vw, 26px);
            --fs-xl: clamp(22px, 3.5vw, 32px);
            
            /* Spacing */
            --spacing-xs: clamp(4px, 0.5vw, 8px);
            --spacing-sm: clamp(8px, 1vw, 12px);
            --spacing-md: clamp(12px, 1.5vw, 18px);
            --spacing-lg: clamp(18px, 2.5vw, 28px);
            --spacing-xl: clamp(24px, 3.5vw, 36px);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-void);
            color: var(--text-bright);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Grid mesh - lebih ringan */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.02) 1px, transparent 1px);
            background-size: 44px 44px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 40% at 15% 0%, rgba(0, 212, 255, 0.05) 0%, transparent 70%),
                radial-gradient(ellipse 45% 35% at 85% 100%, rgba(168, 85, 247, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Scanlines lebih halus */
        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, 
                transparent, 
                transparent 2px, 
                rgba(0, 0, 0, 0.04) 2px, 
                rgba(0, 0, 0, 0.04) 4px);
            pointer-events: none;
            z-index: 1;
            animation: scanMove 10s linear infinite;
        }

        @keyframes scanMove {
            from { transform: translateY(0); }
            to { transform: translateY(4px); }
        }

        .login-wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: var(--spacing-md);
            animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card {
            background: rgba(6, 10, 20, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-glow);
            border-radius: clamp(16px, 2.5vw, 24px);
            padding: var(--spacing-xl) var(--spacing-lg) var(--spacing-lg);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(0, 212, 255, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Corner decorations - lebih subtle */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: clamp(30px, 4vw, 50px);
            height: clamp(30px, 4vw, 50px);
            border-top: 1.5px solid rgba(0, 212, 255, 0.3);
            border-left: 1.5px solid rgba(0, 212, 255, 0.3);
            border-radius: clamp(16px, 2.5vw, 24px) 0 0 0;
            transition: all 0.3s ease;
        }

        .login-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: clamp(30px, 4vw, 50px);
            height: clamp(30px, 4vw, 50px);
            border-bottom: 1.5px solid rgba(168, 85, 247, 0.25);
            border-right: 1.5px solid rgba(168, 85, 247, 0.25);
            border-radius: 0 0 clamp(16px, 2.5vw, 24px) 0;
            transition: all 0.3s ease;
        }

        .login-card:hover::before {
            border-color: rgba(0, 212, 255, 0.6);
            width: clamp(35px, 5vw, 60px);
            height: clamp(35px, 5vw, 60px);
        }

        .login-card:hover::after {
            border-color: rgba(168, 85, 247, 0.5);
            width: clamp(35px, 5vw, 60px);
            height: clamp(35px, 5vw, 60px);
        }

        /* Logo section - lebih compact */
        .login-logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .login-logo-icon {
            width: clamp(40px, 5vw, 52px);
            height: clamp(40px, 5vw, 52px);
            border-radius: clamp(10px, 1.5vw, 14px);
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(18px, 2.5vw, 24px);
            color: #fff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .login-card:hover .login-logo-icon {
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
            transform: scale(1.02);
        }

        .login-logo-text {
            font-size: var(--fs-xl);
            font-weight: 700;
            background: linear-gradient(120deg, var(--neon-cyan), #fff 60%, var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .login-logo-sub {
            font-size: var(--fs-small);
            color: var(--text-dim);
            letter-spacing: 1.5px;
            margin-top: 2px;
            opacity: 0.7;
        }

        /* Typography */
        .login-title {
            font-size: var(--fs-medium);
            font-weight: 700;
            color: var(--text-bright);
            margin-bottom: var(--spacing-xs);
        }

        .login-sub {
            font-size: var(--fs-small);
            color: var(--text-mid);
            margin-bottom: var(--spacing-lg);
            line-height: 1.6;
            opacity: 0.8;
        }

        /* Form fields - lebih rapi */
        .field {
            margin-bottom: var(--spacing-md);
        }

        .field label {
            display: block;
            font-size: var(--fs-small);
            font-weight: 600;
            letter-spacing: 1.2px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .field-inner {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-inner i {
            position: absolute;
            left: 13px;
            color: var(--text-dim);
            font-size: clamp(12px, 1.5vw, 14px);
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .field-inner:focus-within i {
            color: var(--neon-cyan);
        }

        .field input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: clamp(8px, 1.2vw, 12px);
            padding: clamp(10px, 1.2vw, 13px) clamp(12px, 1.5vw, 16px) clamp(10px, 1.2vw, 13px) clamp(35px, 4vw, 42px);
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(12px, 1.5vw, 14px);
            color: var(--text-bright);
            transition: all 0.25s ease;
            outline: none;
            -webkit-appearance: none;
        }

        .field input::placeholder {
            color: var(--text-dim);
            opacity: 0.5;
        }

        .field input:focus {
            border-color: rgba(0, 212, 255, 0.35);
            background: rgba(0, 212, 255, 0.04);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.06);
        }

        .field input:focus::placeholder {
            opacity: 0.3;
        }

        .field input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px rgba(6, 10, 20, 0.95) inset !important;
            -webkit-text-fill-color: var(--text-bright) !important;
        }

        .pw-toggle {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: clamp(11px, 1.2vw, 13px);
            padding: 10px 16px;
            border-radius: 6px;
            transition: all 0.2s ease;
            display: grid;
            align-items: center;
            justify-content: center;
        }

        .pw-toggle:hover {
            color: var(--text-mid);
        }

        .pw-toggle:active {
            transform: scale(0.9);
        }

        /* Login button - lebih interaktif */
        .login-btn {
            width: 100%;
            padding: clamp(11px, 1.2vw, 14px);
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.9), rgba(0, 100, 180, 0.9));
            border: none;
            border-radius: clamp(8px, 1.2vw, 12px);
            font-family: 'JetBrains Mono', monospace;
            font-size: var(--fs-medium);
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #fff;
            box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.3), 0 4px 20px rgba(0, 212, 255, 0.2);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: var(--spacing-sm);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.5), 0 6px 30px rgba(0, 212, 255, 0.35);
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .login-btn.loading {
            opacity: 0.7;
            pointer-events: none;
            transform: scale(0.98);
        }

        .login-btn i {
            transition: transform 0.3s ease;
        }

        .login-btn:hover i {
            transform: translateX(3px);
        }

        .login-btn.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error message - lebih smooth */
        .login-error {
            display: none;
            margin-top: var(--spacing-md);
            padding: clamp(8px, 1vw, 12px) clamp(12px, 1.5vw, 16px);
            background: rgba(255, 61, 90, 0.08);
            border: 1px solid rgba(255, 61, 90, 0.2);
            border-radius: clamp(8px, 1.2vw, 10px);
            font-size: var(--fs-small);
            color: var(--neon-red);
            align-items: center;
            gap: 10px;
            animation: shake 0.4s ease;
        }

        .login-error.show {
            display: flex;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .login-error i {
            font-size: clamp(14px, 1.5vw, 16px);
            flex-shrink: 0;
        }

        /* Footer */
        .login-footer {
            margin-top: var(--spacing-lg);
            text-align: center;
            font-size: var(--fs-small);
            color: var(--text-dim);
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        .login-footer span {
            color: var(--neon-cyan);
            font-weight: 600;
        }

        /* Responsive untuk mobile */
        @media (max-width: 480px) {
            .login-wrap {
                padding: 12px;
            }

            .login-card {
                padding: 24px 20px 20px;
                border-radius: 16px;
            }

            .login-logo {
                gap: 12px;
                margin-bottom: 20px;
            }

            .login-logo-icon {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .login-logo-text {
                font-size: 20px;
            }

            .login-title {
                font-size: 14px;
            }

            .login-sub {
                font-size: 11px;
                margin-bottom: 20px;
            }

            .field {
                margin-bottom: 14px;
            }

            .field input {
                padding: 10px 12px 10px 34px;
                font-size: 13px;
            }

            .field-inner i {
                left: 11px;
                font-size: 12px;
            }

            .login-btn {
                padding: 12px;
                font-size: 13px;
            }

            .login-card::before,
            .login-card::after {
                width: 25px;
                height: 25px;
            }
        }

        /* Untuk layar sangat kecil */
        @media (max-width: 360px) {
            .login-card {
                padding: 20px 16px 16px;
            }

            .login-logo-text {
                font-size: 18px;
            }

            .login-logo-icon {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }

            .login-title {
                font-size: 13px;
            }

            .login-sub {
                font-size: 10px;
            }
        }

        /* Untuk layar besar */
        @media (min-width: 768px) {
            .login-wrap {
                max-width: 440px;
            }

            .login-card {
                padding: 40px 36px 30px;
            }
        }

        /* Prefers reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Dark mode support (already dark) */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-void: #f0f4f8;
                --text-bright: #1a2332;
                --text-mid: #4a5a72;
                --text-dim: #8a9bb0;
            }
            
            .login-card {
                background: rgba(255, 255, 255, 0.95);
                border-color: rgba(0, 0, 0, 0.08);
            }
            
            .field input {
                background: rgba(0, 0, 0, 0.03);
                border-color: rgba(0, 0, 0, 0.08);
                color: #1a2332;
            }
            
            .field input:focus {
                background: rgba(0, 212, 255, 0.04);
                border-color: rgba(0, 212, 255, 0.3);
            }
        }
    </style>
</head>

<body>
    <div class="scanlines" aria-hidden="true"></div>

    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo-icon"><i class="fas fa-terminal"></i></div>
                <div>
                    <div class="login-logo-text">Ftermx</div>
                    <div class="login-logo-sub">WEB TERMINAL PLATFORM</div>
                </div>
            </div>

            <div class="login-title">Sign in to continue</div>
            <div class="login-sub">Enter your credentials to access the terminal.</div>

            <form id="loginForm" autocomplete="off" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <div class="field-inner">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required autofocus>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="field-inner">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="pw-toggle" id="pwToggle" title="Show/hide password" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="pwEyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="login-error" id="loginError">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="loginErrorMsg">Invalid username or password</span>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Sign In</span>
                </button>
            </form>

            <div class="login-footer">
                Secured by <span>Ftermx Auth</span> · <span id="appVersion">…</span>
            </div>
        </div>
    </div>
    <script>
        fetch('/api/version').then(r => r.json()).then(d => {
            document.getElementById('appVersion').textContent = 'v' + d.version;
        }).catch(() => {});

        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const errBox = document.getElementById('loginError');
        const errMsg = document.getElementById('loginErrorMsg');
        const pwInput = document.getElementById('password');
        const pwBtn = document.getElementById('pwToggle');
        const eyeIcon = document.getElementById('pwEyeIcon');

        pwBtn.addEventListener('click', () => {
            const show = pwInput.type === 'password';
            pwInput.type = show ? 'text' : 'password';
            eyeIcon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errBox.classList.remove('show');
            btn.classList.add('loading');
            btn.querySelector('i').className = 'fas fa-spinner';
            btn.querySelector('span').textContent = 'Signing in…';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = data.redirect || '/ftermx';
                } else {
                    errMsg.textContent = data.error || 'Invalid username or password';
                    errBox.classList.add('show');
                    btn.classList.remove('loading');
                    btn.querySelector('i').className = 'fas fa-sign-in-alt';
                    btn.querySelector('span').textContent = 'Sign In';
                }
            } catch {
                errMsg.textContent = 'Network error — please try again';
                errBox.classList.add('show');
                btn.classList.remove('loading');
                btn.querySelector('i').className = 'fas fa-sign-in-alt';
                btn.querySelector('span').textContent = 'Sign In';
            }
        });
    </script>
</html>
